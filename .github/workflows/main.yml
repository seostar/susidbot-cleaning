name: Cleaner Bot
on:
  schedule:
    # 1. Щоденне сканування о 22:00 за Києвом (19:00 UTC влітку / 20:00 UTC взимку)
    - cron: '0 19,20 * * *'
    
    # 2. 1-ше число: сканування о 09:00 та відправка о 10:00 за Києвом
    - cron: '0 6,7,8 1 * *'
    
    # 3. 11-те та 19-те числа: сканування о 10:00 та відправка об 11:00 за Києвом
    - cron: '0 7,8,9 11,19 * *'
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: {python-version: '3.9'}
        
      - run: pip install pyTelegramBotAPI pytz requests
      
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bot.py
        
      - name: Save History
        run: |
          git config --global user.name "SusidBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update history [skip ci]" && git push)
