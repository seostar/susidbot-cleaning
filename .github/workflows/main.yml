name: Cleaner Bot
on:
  schedule:
    # 1. Щоденне тихе сканування (22:30 Київ = 19:30 UTC)
    - cron: '30 19 * * *'
    
    # 2. Привітання 1-го числа (09:00 ранку Київ = 06:00 UTC)
    - cron: '0 6 1 * *'
    
    # 3. Звіт 11-го числа (12:00 дня Київ = 09:00 UTC)
    - cron: '0 9 11 * *'
    
    # 4. Нагадування 19-го числа (12:00 дня Київ = 09:00 UTC)
    - cron: '0 9 19 * *'
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      # Оновлено до @v4 для підтримки Node.js 24
      - uses: actions/checkout@v4
      
      # Оновлено до @v5 для підтримки Node.js 24
      - uses: actions/setup-python@v5
        with: {python-version: '3.9'}
        
      - run: pip install pyTelegramBotAPI pytz requests
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bot.py
      - name: Save History
        run: |
          git config --global user.name "SusidBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update history [skip ci]" && git push)
