name: Cleaner Bot
on:
  schedule:
    # 1. Щоденне сканування о 21:00 за UTC (це 23:00/00:00 за Києвом)
    - cron: '0 21 * * *'
    
    # 2. Часті запуски 1, 11 та 19 числа з 09:00 до 18:00 за Києвом (06, 09, 12, 15 за UTC)
    # Це гарантує, що навіть при затримках на серверах GitHub, повідомлення піде вдень.
    - cron: '0 6,9,12,15 1,11,19 * *'
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: {python-version: '3.9'}
        
      - run: pip install pyTelegramBotAPI pytz requests
      
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bot.py
        
      - name: Save History
        run: |
          git config --global user.name "SusidBot"
          git config --global user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update history [skip ci]" && git push)
